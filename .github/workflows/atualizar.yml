# Roda os coletores todo dia, grava os dados atualizados no repositório e publica o site no GitHub Pages.
# Também dá para rodar na hora: aba Actions > "Atualizar e publicar o mapa" > Run workflow.
name: Atualizar e publicar o mapa

on:
  schedule:
    - cron: "0 9 * * *"     # todo dia às 9h UTC (6h em Brasília)
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["site/**", "data/**", "scripts/**", ".github/workflows/**"]

permissions:
  contents: write   # gravar os dados novos
  pages: write
  id-token: write

concurrency:
  group: atualizar-mapa
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicar.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Rodar coletores e gerar os dados
        if: github.event_name != 'push'
        # Se algum coletor falhar, os outros seguem e o CSV anterior daquela fonte é mantido
        continue-on-error: true
        env:
          PYTHONIOENCODING: utf-8
        run: python scripts/atualizar.py

      - name: Gerar os dados (sem coletar)
        if: github.event_name == 'push'
        run: python scripts/gerar_dados.py

      - name: Gravar os dados atualizados
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/leiloes.js data/coletados
          git diff --cached --quiet || git commit -m "Atualiza leilões ($(date -u +%Y-%m-%d))"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: publicar
        uses: actions/deploy-pages@v4
