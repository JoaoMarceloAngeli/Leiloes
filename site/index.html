<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mapa de Leilões</title>
  <meta name="description" content="Leilões de gado do Brasil no mapa: datas, locais, rota e lembrete.">
  <meta name="theme-color" content="#8cc584">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icone-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icone-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Leilões">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
  <link rel="stylesheet" href="estilo.css">
</head>
<body>
  <aside id="painel">
    <header>
      <h1>Leilões de Gado</h1>
      <p id="resumo">Carregando…</p>
    </header>

    <div class="filtros">
      <input id="busca" type="search" placeholder="Buscar leilão, recinto, cidade, leiloeira, raça…" autocomplete="off">
      <div class="linha">
        <select id="f-uf"><option value="">Todos os estados</option></select>
        <select id="f-tipo"><option value="">Todos os tipos</option></select>
      </div>
      <div class="linha">
        <select id="f-modalidade"><option value="">Presencial e virtual</option></select>
        <select id="f-periodo">
          <option value="">Qualquer data</option>
          <option value="7">Próximos 7 dias</option>
          <option value="30">Próximos 30 dias</option>
          <option value="90">Próximos 90 dias</option>
        </select>
      </div>
      <div class="linha">
        <select id="f-raca"><option value="">Todas as raças</option></select>
        <select id="f-distancia">
          <option value="">Qualquer distância</option>
          <option value="50">Até 50 km de mim</option>
          <option value="100">Até 100 km de mim</option>
          <option value="200">Até 200 km de mim</option>
          <option value="300">Até 300 km de mim</option>
        </select>
      </div>
      <button id="perto" type="button">📍 Leilões perto de mim</button>
      <button id="instalar" type="button" hidden>📲 Instalar no celular</button>
      <p id="dica-ios" class="dica" hidden>📲 Para instalar no iPhone: toque em <b>Compartilhar</b> e depois em
        <b>Adicionar à Tela de Início</b>. <button type="button">Entendi</button></p>
      <label class="opcao"><input id="sem-virtuais" type="checkbox" autocomplete="off"> Esconder leilões virtuais</label>
      <label class="opcao"><input id="com-recintos" type="checkbox" checked autocomplete="off"> Mostrar recintos de leilão</label>
      <label class="opcao"><input id="so-favoritos" type="checkbox" autocomplete="off"> <span class="estrela">★</span> Só favoritos</label>
      <div class="legenda">
        <span><span class="pino pino-mini"></span> Leilão presencial (com data)</span>
        <span><span class="pino pino-mini pino-virtual"></span> Leilão virtual</span>
        <span><span class="recinto recinto-mini"></span> Local de leilão (sem data)</span>
      </div>
    </div>

    <ul id="lista"></ul>
    <footer id="rodape"></footer>
  </aside>

  <main id="mapa"></main>
  <button id="alternar" type="button" aria-label="Mostrar lista">☰ Lista</button>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
  <script src="leiloes.js" charset="utf-8"></script>
  <script src="app.js"></script>
</body>
</html>
